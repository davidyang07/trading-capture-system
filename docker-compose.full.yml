# Trading Capture System — full compose stack override (Phase 12: full-system testing).
#
# Layer this on top of the infrastructure compose file to run the four backend services
# containerized alongside MySQL / Redis / Keycloak / Kafka / Schema Registry / Prometheus /
# Grafana, from a single startup:
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
#   (or:  .\scripts\full-stack-up.ps1)
#
# Keycloak issuer (frontchannel/backchannel split, ADR-0018)
# --------------------------------------------------------------------------------------------
# Tokens must carry ONE issuer that every principal agrees on — the host-run pipeline harness
# and admin-web mint tokens via localhost:8180, while the containerized allocation-engine mints
# M2M tokens via keycloak:8180. KC_HOSTNAME pins the frontchannel issuer to
# http://localhost:8180 for ALL tokens; KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets containers keep
# using http://keycloak:8180 for the token/JWKS endpoints. Services therefore validate
# iss=http://localhost:8180/realms/tcs (OIDC_ISSUER) but fetch keys from the container-reachable
# http://keycloak:8180/... (OIDC_JWK_SET_URI). See the security-support jwtDecoder split.
#
# admin-web runs on the host for the UI E2E (Playwright webServer) — the Phase-10-proven setup —
# so a browser and the BFF both reach Keycloak at localhost:8180. A containerized admin-web is
# provided under the opt-in `ui` profile for a fully-in-compose demo. Its final delivery
# hardening (and the K8s/Jenkins path) is Phase 13.

name: tcs

services:
  keycloak:
    environment:
      # Pin the frontchannel issuer so every token (host- or container-minted) shares one iss.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  prometheus:
    # Scrape the services by compose DNS instead of host.docker.internal (base file).
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.full.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  trading-service:
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    image: tcs/trading-service:dev
    container_name: tcs-trading-service
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: json-logs
      SERVICE_NAME: trading-service
      TRADING_DB_HOST: mysql
      TRADING_DB_PORT: "3306"
      TRADING_DB_USER: ${TRADING_DB_USER:-trading_svc}
      TRADING_DB_PASSWORD: ${TRADING_DB_PASSWORD:-trading_dev}
      OIDC_ISSUER: http://localhost:8180/realms/tcs
      OIDC_JWK_SET_URI: http://keycloak:8180/realms/tcs/protocol/openid-connect/certs
    ports:
      - "8081:8081"

  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    image: tcs/account-service:dev
    container_name: tcs-account-service
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: json-logs
      SERVICE_NAME: account-service
      ACCOUNT_DB_HOST: mysql
      ACCOUNT_DB_PORT: "3306"
      ACCOUNT_DB_USER: ${ACCOUNT_DB_USER:-account_svc}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-account_dev}
      OIDC_ISSUER: http://localhost:8180/realms/tcs
      OIDC_JWK_SET_URI: http://keycloak:8180/realms/tcs/protocol/openid-connect/certs
    ports:
      - "8082:8082"

  enrichment-service:
    build:
      context: .
      dockerfile: services/enrichment-service/Dockerfile
    image: tcs/enrichment-service:dev
    container_name: tcs-enrichment-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: json-logs
      SERVICE_NAME: enrichment-service
      ENRICHMENT_DB_HOST: mysql
      ENRICHMENT_DB_PORT: "3306"
      ENRICHMENT_DB_USER: ${ENRICHMENT_DB_USER:-enrichment_svc}
      ENRICHMENT_DB_PASSWORD: ${ENRICHMENT_DB_PASSWORD:-enrichment_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OIDC_ISSUER: http://localhost:8180/realms/tcs
      OIDC_JWK_SET_URI: http://keycloak:8180/realms/tcs/protocol/openid-connect/certs
    ports:
      - "8083:8083"

  allocation-engine:
    build:
      context: .
      dockerfile: services/allocation-engine/Dockerfile
    image: tcs/allocation-engine:dev
    container_name: tcs-allocation-engine
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      trading-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      enrichment-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: json-logs
      SERVICE_NAME: allocation-engine
      ALLOCATION_DB_HOST: mysql
      ALLOCATION_DB_PORT: "3306"
      ALLOCATION_DB_USER: ${ALLOCATION_DB_USER:-allocation_svc}
      ALLOCATION_DB_PASSWORD: ${ALLOCATION_DB_PASSWORD:-allocation_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OIDC_ISSUER: http://localhost:8180/realms/tcs
      OIDC_JWK_SET_URI: http://keycloak:8180/realms/tcs/protocol/openid-connect/certs
      OIDC_TOKEN_URI: http://keycloak:8180/realms/tcs/protocol/openid-connect/token
      ALLOCATION_CLIENT_ID: allocation-engine
      ALLOCATION_CLIENT_SECRET: ${ALLOCATION_ENGINE_CLIENT_SECRET:-allocation-engine-dev-secret}
      ACCOUNT_SERVICE_URL: http://account-service:8082
      ENRICHMENT_SERVICE_URL: http://enrichment-service:8083
      TRADING_SERVICE_URL: http://trading-service:8081
    ports:
      - "8084:8084"

  # Opt-in fully-containerized admin-web (demo only): `docker compose --profile ui ...`.
  # The tested UI-E2E path runs admin-web on the host (Playwright webServer); see README.
  admin-web:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    image: tcs/admin-web:dev
    container_name: tcs-admin-web
    depends_on:
      keycloak:
        condition: service_healthy
      trading-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      enrichment-service:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-full-stack-session-dev-secret}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: admin-web
      # Discovery via the container-reachable URL; KC_HOSTNAME_BACKCHANNEL_DYNAMIC returns the
      # frontchannel authorization_endpoint (localhost:8180) for the browser.
      AUTH_KEYCLOAK_ISSUER: http://keycloak:8180/realms/tcs
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TRADING_SERVICE_URL: http://trading-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      ENRICHMENT_SERVICE_URL: http://enrichment-service:8083
      ALLOCATION_ENGINE_URL: http://allocation-engine:8084
    ports:
      - "3000:3000"
