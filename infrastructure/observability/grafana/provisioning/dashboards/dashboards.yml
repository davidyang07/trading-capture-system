# Grafana dashboard provider (Phase 11). Loads the JSON dashboards mounted read-only.
apiVersion: 1

providers:
  - name: tcs-dashboards
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
