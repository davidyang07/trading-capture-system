# EXAMPLE Secret — development placeholders ONLY (the `_dev` / `-dev-secret` convention used
# across the repo). This file is committed so the manifest set is self-contained and validatable,
# but it is NOT for any real environment: replace every value before deploying anywhere real, and
# source real values from a sealed-secrets / external-secrets / cloud secret manager. The
# Deployments reference these keys via secretKeyRef (never inline).
#
# stringData keeps the placeholders human-readable (Kubernetes base64-encodes them on apply).
apiVersion: v1
kind: Secret
metadata:
  name: tcs-secrets
  namespace: tcs
  labels:
    app.kubernetes.io/part-of: trading-capture-system
    # Flag loudly that these are non-production placeholders.
    tcs.dev/placeholder: "true"
type: Opaque
stringData:
  # Per-service DB users (each service owns its own schema/user).
  TRADING_DB_USER: "trading_svc"
  TRADING_DB_PASSWORD: "trading_dev"
  ACCOUNT_DB_USER: "account_svc"
  ACCOUNT_DB_PASSWORD: "account_dev"
  ENRICHMENT_DB_USER: "enrichment_svc"
  ENRICHMENT_DB_PASSWORD: "enrichment_dev"
  ALLOCATION_DB_USER: "allocation_svc"
  ALLOCATION_DB_PASSWORD: "allocation_dev"
  # allocation-engine OAuth2 client-credentials secret (Keycloak confidential client).
  ALLOCATION_ENGINE_CLIENT_SECRET: "allocation-engine-dev-secret"
  # admin-web Auth.js session encryption secret.
  AUTH_SECRET: "admin-web-session-dev-secret"
