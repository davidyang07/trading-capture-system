# account-service — ConfigMap + Deployment + Service. Stateless REST API (accounts/ledgers);
# horizontally scalable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcs-account-config
  namespace: tcs
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: trading-capture-system
data:
  SPRING_PROFILES_ACTIVE: "json-logs"
  SERVICE_NAME: "account-service"
  ACCOUNT_DB_HOST: "mysql"
  ACCOUNT_DB_PORT: "3306"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: tcs
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: trading-capture-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: trading-capture-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: tcs-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account-service
          image: tcs/account-service:0.13.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: tcs-common-config
            - configMapRef:
                name: tcs-account-config
          env:
            - name: ACCOUNT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: tcs-secrets
                  key: ACCOUNT_DB_USER
            - name: ACCOUNT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcs-secrets
                  key: ACCOUNT_DB_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: tcs
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: trading-capture-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: account-service
  ports:
    - name: http
      port: 8082
      targetPort: http
