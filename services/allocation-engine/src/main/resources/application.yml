server:
  port: 8084

spring:
  application:
    name: allocation-engine
  datasource:
    # Host port 3307: this machine's local mysqld owns 3306 (docs/status/known-gaps.md).
    url: jdbc:mysql://${ALLOCATION_DB_HOST:localhost}:${ALLOCATION_DB_PORT:3307}/${ALLOCATION_DB_NAME:tcs_allocation}?connectionTimeZone=UTC
    username: ${ALLOCATION_DB_USER:allocation_svc}
    password: ${ALLOCATION_DB_PASSWORD:allocation_dev} # documented dev placeholder (.env.example)
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/tcs}
      # Machine (client-credentials) identity for the Phase 8 M2M clients. One confidential
      # allocation-engine client carries every downstream audience/scope it needs; tokens are
      # acquired + cached by Spring Security. The secret is a documented dev placeholder — the
      # real value comes from the environment (never committed). Live token flow is Phase 9.
      client:
        registration:
          allocation-engine:
            provider: keycloak
            client-id: ${ALLOCATION_CLIENT_ID:allocation-engine}
            client-secret: ${ALLOCATION_CLIENT_SECRET:allocation-engine-dev-secret}
            authorization-grant-type: client_credentials
            scope: allocation:process,account:validate,enrichment:read
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/tcs/protocol/openid-connect/token}
  data:
    redis:
      # Phase 8 dedup pre-filter (ADR-0007). A Redis outage falls back safely to DB authority.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: allocation-engine
      # Replay from the beginning when the group is new: ingestion is idempotent
      # (raw_messages coordinates + allocation business key, ADR-0007).
      auto-offset-reset: earliest
      # Offsets are committed by the container after the listener returns (ack-mode record)
      # — never before the durable work of the attempt is done.
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

tcs:
  security:
    # Tokens must carry this audience (attached by the realm's allocation-engine-aud scope
    # once Phase 9 finalizes the realm; no business endpoints exist yet).
    audience: allocation-engine
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  ingest:
    # Inbound topic and retry shape (docs/contracts/event-catalog.md). Defaults are the
    # production contract — 4 attempts, exponential 1s -> 4s -> 16s, then the DLT;
    # integration tests shrink the delays to exercise real exhaustion quickly.
    inbound-topic: tcs.fix.allocation-instruction.v1
    retry:
      attempts: 4
      initial-delay-ms: 1000
      multiplier: 4.0
  outbox:
    # ADR-0005: poller latency/throughput knobs. `enabled` exists for tests that need a
    # context without a competing publisher; production always leaves it on.
    poll-interval: 500ms
    batch-size: 50
    publish-timeout: 10s
    enabled: true
  clients:
    # Phase 8 M2M dependency base URLs + timeouts (registrationId defaults to allocation-engine).
    account:
      base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
      connect-timeout: 2s
      read-timeout: 5s
    enrichment:
      base-url: ${ENRICHMENT_SERVICE_URL:http://localhost:8083}
      connect-timeout: 2s
      read-timeout: 5s
    trading:
      base-url: ${TRADING_SERVICE_URL:http://localhost:8081}
      connect-timeout: 2s
      read-timeout: 5s
  orchestration:
    # Phase 8 driver (ADR-0006): one scheduled driver claims eligible work (new, due retries,
    # expired leases) with FOR UPDATE SKIP LOCKED and advances each allocation. Tests disable the
    # schedule and call runOnce() directly for determinism.
    enabled: ${ORCHESTRATION_ENABLED:true}
    poll-interval: 1s
    batch-size: 20
    claim-lease: 2m
    retry-backoff-base: 5s
    retry-backoff-multiplier: 2.0
    retry-backoff-max: 10m
    max-steps-per-run: 6
    dedup-ttl: 30m

# Resilience4j only wraps the remote HTTP boundaries. The retry/record predicate
# (RetryableDependencyPredicate) ensures only transient DependencyCallExceptions are retried and
# counted toward the breaker — 4xx business/authorization results are neither retried nor tripping.
resilience4j:
  retry:
    instances:
      account: &dependencyRetry
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: com.tradingcapture.allocation.client.RetryableDependencyPredicate
      enrichment: *dependencyRetry
      trading: *dependencyRetry
  circuitbreaker:
    instances:
      account: &dependencyBreaker
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        record-exception-predicate: com.tradingcapture.allocation.client.RetryableDependencyPredicate
      enrichment: *dependencyBreaker
      trading: *dependencyBreaker

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A Redis outage must not fail readiness — the dedup pre-filter falls back to DB authority.
    redis:
      enabled: false
