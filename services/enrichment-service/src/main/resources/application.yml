server:
  port: 8083

spring:
  application:
    name: enrichment-service
  datasource:
    # Host port 3307: this machine's local mysqld owns 3306 (docs/status/known-gaps.md).
    url: jdbc:mysql://${ENRICHMENT_DB_HOST:localhost}:${ENRICHMENT_DB_PORT:3307}/${ENRICHMENT_DB_NAME:tcs_enrichment}?connectionTimeZone=UTC
    username: ${ENRICHMENT_DB_USER:enrichment_svc}
    password: ${ENRICHMENT_DB_PASSWORD:enrichment_dev} # documented dev placeholder (.env.example)
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/seed carries the deterministic reference data; production-style deployments
    # override this property to db/migration only (see services/enrichment-service/README.md).
    locations: classpath:db/migration,classpath:db/seed
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts so a Redis outage degrades to the DB fast (cache is never authoritative).
      timeout: 250ms
      connect-timeout: 250ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/tcs}

tcs:
  security:
    # Tokens must carry this audience (attached by the realm's enrichment-service-aud scope).
    audience: enrichment-service
  cache:
    # Read-through TTL for reference lookups (ADR-0003). Redis is an optimization only.
    ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A Redis outage must not fail the service's readiness — the DB remains authoritative.
    redis:
      enabled: false
