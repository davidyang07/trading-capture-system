server:
  port: 8083

spring:
  application:
    name: enrichment-service
  datasource:
    # Host port 3307: this machine's local mysqld owns 3306 (docs/status/known-gaps.md).
    url: jdbc:mysql://${ENRICHMENT_DB_HOST:localhost}:${ENRICHMENT_DB_PORT:3307}/${ENRICHMENT_DB_NAME:tcs_enrichment}?connectionTimeZone=UTC
    username: ${ENRICHMENT_DB_USER:enrichment_svc}
    password: ${ENRICHMENT_DB_PASSWORD:enrichment_dev} # documented dev placeholder (.env.example)
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Schema only. db/seed holds demo reference data (exchanges, currencies, instruments, fee rules) and is opt-in through the
    # `demo-seed` profile (application-demo-seed.yml), never loaded by default.
    locations: classpath:db/migration
    # Databases created before the seed became opt-in have already applied the V2 seed; let them
    # start without it on the classpath instead of failing validation.
    ignore-migration-patterns: "*:missing,*:future"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts so a Redis outage degrades to the DB fast (cache is never authoritative).
      timeout: 250ms
      connect-timeout: 250ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/tcs}

tcs:
  security:
    # Tokens must carry this audience (attached by the realm's enrichment-service-aud scope).
    audience: enrichment-service
    # Optional backchannel JWKS URL (containerized full stack — Phase 12, ADR-0018). Blank =
    # discover JWKS from the issuer; iss is validated against issuer-uri either way. A TCS-owned
    # key so Spring Boot's own JWKS auto-config never activates a second decoder.
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
  cache:
    # Read-through TTL for reference lookups (ADR-0003). Redis is an optimization only.
    ttl: 15m

springdoc:
  # The contract UI is a development aid, not part of the runtime contract. Anonymous access
  # (see SecurityConfig) is granted only while this is on; the Kubernetes ConfigMaps set
  # EXPOSE_API_DOCS=false so deployed environments serve no unauthenticated API contract.
  api-docs:
    enabled: ${EXPOSE_API_DOCS:true}
  swagger-ui:
    enabled: ${EXPOSE_API_DOCS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A Redis outage must not fail the service's readiness — the DB remains authoritative.
    redis:
      enabled: false
