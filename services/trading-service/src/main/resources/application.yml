server:
  port: 8081

spring:
  application:
    name: trading-service
  datasource:
    # Host port 3307: this machine's local mysqld owns 3306 (docs/status/known-gaps.md).
    url: jdbc:mysql://${TRADING_DB_HOST:localhost}:${TRADING_DB_PORT:3307}/${TRADING_DB_NAME:tcs_trading}?connectionTimeZone=UTC
    username: ${TRADING_DB_USER:trading_svc}
    password: ${TRADING_DB_PASSWORD:trading_dev} # documented dev placeholder (.env.example)
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Schema only. db/seed holds demo orders and executions and is opt-in through the
    # `demo-seed` profile (application-demo-seed.yml), never loaded by default.
    locations: classpath:db/migration
    # Databases created before the seed became opt-in have already applied the V2 seed; let them
    # start without it on the classpath instead of failing validation.
    ignore-migration-patterns: "*:missing,*:future"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/tcs}

tcs:
  security:
    # Tokens must carry this audience (attached by the realm's trading-service-aud scope).
    audience: trading-service
    # Optional backchannel JWKS URL (containerized full stack — Phase 12, ADR-0018): set when
    # Keycloak's browser-facing issuer differs from the URL this service reaches it at. Blank =
    # discover JWKS from the issuer. The iss claim is validated against issuer-uri either way.
    # A TCS-owned key (not spring.security.oauth2.resourceserver.jwt.*) so Boot's own JWKS
    # auto-config never activates a second decoder.
    jwk-set-uri: ${OIDC_JWK_SET_URI:}

springdoc:
  # The contract UI is a development aid, not part of the runtime contract. Anonymous access
  # (see SecurityConfig) is granted only while this is on; the Kubernetes ConfigMaps set
  # EXPOSE_API_DOCS=false so deployed environments serve no unauthenticated API contract.
  api-docs:
    enabled: ${EXPOSE_API_DOCS:true}
  swagger-ui:
    enabled: ${EXPOSE_API_DOCS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
