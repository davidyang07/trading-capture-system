server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    # Host port 3307: this machine's local mysqld owns 3306 (docs/status/known-gaps.md).
    url: jdbc:mysql://${ACCOUNT_DB_HOST:localhost}:${ACCOUNT_DB_PORT:3307}/${ACCOUNT_DB_NAME:tcs_account}?connectionTimeZone=UTC
    username: ${ACCOUNT_DB_USER:account_svc}
    password: ${ACCOUNT_DB_PASSWORD:account_dev} # documented dev placeholder (.env.example)
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/seed carries the deterministic dev/demo data; production-style deployments
    # override this property to db/migration only (see services/account-service/README.md).
    locations: classpath:db/migration,classpath:db/seed
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/tcs}

tcs:
  security:
    # Tokens must carry this audience (attached by the realm's account-service-aud scope).
    audience: account-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
